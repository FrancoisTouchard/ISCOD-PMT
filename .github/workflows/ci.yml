name: CI/CD Fullstack (Frontend + Backend + Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/pmt-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/pmt-frontend

jobs:
  # ============================================
  # JOB 1 : Tests Frontend (Angular)
  # ============================================
  test-frontend:
    name: 🎨 Tests Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/pmt

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔧 Configuration Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./frontend/pmt/package-lock.json"

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔍 Linting Frontend
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🧪 Tests unitaires Frontend
        run: npm run test:ci

      - name: 📊 Génération du rapport de couverture Frontend
        run: npm run test:coverage

      - name: ✅ Vérification du seuil de couverture Frontend (60%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Couverture Frontend: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Erreur: La couverture frontend est inférieure à 60% ($COVERAGE%)"
            exit 1
          else
            echo "✅ Couverture Frontend OK: $COVERAGE%"
          fi

      - name: 📤 Upload du rapport de couverture Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/pmt/coverage/
          retention-days: 30

  # ============================================
  # JOB 2 : Tests Backend (Java Spring Boot)
  # ============================================
  test-backend:
    name: ⚙️ Tests Backend (Spring Boot)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/pmt

    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ☕ Configuration Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: "maven"

      - name: 🔍 Vérification du build système
        run: |
          if [ -f "pom.xml" ]; then
            echo "✅ Projet Maven détecté"
            BUILD_TOOL="maven"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "✅ Projet Gradle détecté"
            BUILD_TOOL="gradle"
          else
            echo "❌ Aucun fichier pom.xml ou build.gradle trouvé"
            exit 1
          fi
          echo "BUILD_TOOL=$BUILD_TOOL" >> $GITHUB_ENV

      - name: 🔨 Build et Tests (Maven)
        if: env.BUILD_TOOL == 'maven'
        run: mvn clean verify -B

      - name: 🔨 Build et Tests (Gradle)
        if: env.BUILD_TOOL == 'gradle'
        run: ./gradlew clean build test

      - name: 📊 Génération du rapport de couverture Backend
        if: env.BUILD_TOOL == 'maven'
        run: mvn jacoco:report -B

      - name: 📊 Génération du rapport de couverture Backend (Gradle)
        if: env.BUILD_TOOL == 'gradle'
        run: ./gradlew jacocoTestReport

      - name: ✅ Vérification du seuil de couverture Backend (60%)
        run: |
          if [ "$BUILD_TOOL" == "maven" ]; then
            COVERAGE_FILE="target/site/jacoco/jacoco-resources/jacoco.csv"
          else
            COVERAGE_FILE="build/reports/jacoco/test/jacocoTestReport.csv"
          fi

          if [ -f "$COVERAGE_FILE" ]; then
            TOTAL_LINE=$(grep "^TOTAL" "$COVERAGE_FILE")
            MISSED=$(echo "$TOTAL_LINE" | awk -F, '{print $4}')
            COVERED=$(echo "$TOTAL_LINE" | awk -F, '{print $5}')
            TOTAL=$((MISSED + COVERED))
            if [ "$TOTAL" -eq 0 ]; then
              COVERAGE=0
            else
              COVERAGE=$(echo "$COVERED * 100 / $TOTAL" | bc -l)
            fi
            echo "Couverture Backend (instructions) : $COVERAGE%"
            if (( $(echo "$COVERAGE < 60" | bc -l) )); then
              echo "⚠️ Attention: La couverture backend est inférieure à 60% ($COVERAGE%)"
              exit 0
            else
              echo "✅ Couverture Backend OK: $COVERAGE%"
            fi
          else
            echo "⚠️ Fichier de couverture non trouvé, vérification ignorée"
          fi

      - name: 📤 Upload du rapport de couverture Backend (Maven)
        if: always() && env.BUILD_TOOL == 'maven'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/pmt/target/site/jacoco/
          retention-days: 30

      - name: 📤 Upload du rapport de couverture Backend (Gradle)
        if: always() && env.BUILD_TOOL == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/pmt/build/reports/jacoco/
          retention-days: 30

      - name: 📤 Upload des résultats de tests Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/pmt/target/surefire-reports/
            backend/pmt/build/test-results/
          retention-days: 7

  # ============================================
  # JOB 3 : Build et Push Docker Backend
  # ============================================
  docker-backend:
    name: 🐳 Docker Backend
    runs-on: ubuntu-latest
    needs: test-backend
    # Uniquement sur push vers main (pas sur PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: 🔨 Build et Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/pmt
          file: ./backend/pmt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Image Backend déployée
        run: |
          echo "🎉 Image backend déployée sur Docker Hub !"
          echo "📦 Image: ${{ env.BACKEND_IMAGE }}:latest"

  # ============================================
  # JOB 4 : Build et Push Docker Frontend
  # ============================================
  docker-frontend:
    name: 🐳 Docker Frontend
    runs-on: ubuntu-latest
    needs: test-frontend
    # Uniquement sur push vers main (pas sur PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: 🔨 Build et Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/pmt
          file: ./frontend/pmt/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Image Frontend déployée
        run: |
          echo "🎉 Image frontend déployée sur Docker Hub !"
          echo "📦 Image: ${{ env.FRONTEND_IMAGE }}:latest"

  # ============================================
  # JOB 5 : Build Frontend (conservé pour artifact)
  # ============================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    defaults:
      run:
        working-directory: ./frontend/pmt

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔧 Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "./frontend/pmt/package-lock.json"

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🏗️ Build de production Frontend
        run: npm run build --if-present

      - name: 📤 Upload de l'artifact de build Frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/pmt/dist/
          retention-days: 7

  # ============================================
  # JOB 6 : Build Backend (conservé pour JAR)
  # ============================================
  build-backend:
    name: 🏗️ Build Backend (JAR)
    runs-on: ubuntu-latest
    needs: test-backend

    defaults:
      run:
        working-directory: ./backend/pmt

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ☕ Configuration Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: 🏗️ Build JAR (Maven)
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package -DskipTests -B
          fi

      - name: 🏗️ Build JAR (Gradle)
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            ./gradlew build -x test
          fi

      - name: 📤 Upload de l'artifact JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            backend/pmt/target/*.jar
            backend/pmt/build/libs/*.jar
          retention-days: 7

  # ============================================
  # JOB 7 : Notification finale
  # ============================================
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, docker-frontend, docker-backend]
    if: always()

    steps:
      - name: 📊 Status du pipeline
        run: |
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Docker Frontend: ${{ needs.docker-frontend.result }}"
          echo "Docker Backend: ${{ needs.docker-backend.result }}"

          if [ "${{ needs.test-frontend.result }}" == "success" ] && \
             [ "${{ needs.test-backend.result }}" == "success" ]; then
            echo "✅ Tests réussis !"
            
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
              if [ "${{ needs.docker-frontend.result }}" == "success" ] && \
                 [ "${{ needs.docker-backend.result }}" == "success" ]; then
                echo "🐳 Images Docker déployées avec succès !"
              else
                echo "❌ Échec du déploiement Docker"
                exit 1
              fi
            fi
          else
            echo "❌ Pipeline échouée"
            exit 1
          fi
