services:
  # Backend Spring Boot
  backend:
    build:
      context: ./backend/pmt
      dockerfile: Dockerfile
    container_name: pmt-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - pmt-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Frontend Angular + Nginx
  frontend:
    build:
      context: ./frontend/pmt
      dockerfile: Dockerfile
    container_name: pmt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pmt-network

networks:
  pmt-network:
    driver: bridge
